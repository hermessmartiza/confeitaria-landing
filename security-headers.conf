# Headers de segurança comuns a toda location — incluído via `include` pra
# não repetir (e arriscar divergir) em cada bloco do nginx.conf.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://confeitaria.smartiza.com.br https://viacep.com.br https://cobrancas.api.efipay.com.br https://cobrancas-h.api.efipay.com.br https://tokenizer.sejaefi.com.br https://device.clearsale.com.br https://web.fpcs-monitor.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
