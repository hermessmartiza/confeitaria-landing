server {
    listen 80;
    server_tokens off;
    absolute_redirect off;
    include security-headers.conf;
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets (inclui public/landing-assets/fonts/ — fontes
    # auto-hospedadas, antes vinham do Google Fonts CDN sem cache/minificação
    # sob nosso controle)
    location /landing-assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include security-headers.conf;
        try_files $uri @asset_missing;
    }

    # Asset de build antigo (HTML velho em cache de webview): devolve stub JS
    # que recarrega a página uma vez, em vez de 404 que vira tela branca
    location @asset_missing {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        include security-headers.conf;
        return 200 "try{if(!sessionStorage.getItem('__staleAsset')){sessionStorage.setItem('__staleAsset','1');location.reload(!0)}}catch(e){location.reload()}";
    }

    # Arquivos estáticos sem hash no nome (não têm cache-busting por URL como
    # /landing-assets, então cache moderado — 1 dia — em vez de no-store ou
    # de 1 ano; qualquer mudança sai num redeploy de qualquer forma)
    location ~ ^/(favicon\.ico|site\.webmanifest|manifest\.json|llms\.txt|sitemap\.xml|robots\.txt|static-pages\.css)$ {
        add_header Cache-Control "public, max-age=86400";
        include security-headers.conf;
    }

    # nginx não conhece .webmanifest por padrão (serve como octet-stream)
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        include security-headers.conf;
    }

    # Signup (Fase 6) — proxy interno pro confeitto-backend, sem expor a API
    # publicamente (mesmo padrão do frontend de loja e do painel).
    location /api/ {
        proxy_pass http://confeitto-backend:3001/api/;
        add_header Cache-Control "no-store";
        include security-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Páginas estáticas geradas (Termos, Privacidade, FAQ, Blog) via URL limpa
    # — /termos serve termos.html, sem precisar da extensão na barra de endereço.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-store";
        include security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
