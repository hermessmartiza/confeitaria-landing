server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @asset_missing;
    }

    # Asset de build antigo (HTML velho em cache de webview): devolve stub JS
    # que recarrega a página uma vez, em vez de 404 que vira tela branca
    location @asset_missing {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "try{if(!sessionStorage.getItem('__staleAsset')){sessionStorage.setItem('__staleAsset','1');location.reload(!0)}}catch(e){location.reload()}";
    }

    # Signup (Fase 6) — proxy interno pro confeitto-backend, sem expor a API
    # publicamente (mesmo padrão do frontend de loja e do painel).
    location /api/ {
        proxy_pass http://confeitto-backend:3001/api/;
        add_header Cache-Control "no-store";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA fallback — HTML nunca em cache (webviews WhatsApp/Instagram)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
